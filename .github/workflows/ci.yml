name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-fast:
    name: verify-fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a3252b77841bbdd9e4decf73d9a7f1fe76b0493 # v4.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:fast
        env:
          CARINA_REGISTRY_TOKEN: ${{ secrets.CARINA_REGISTRY_TOKEN || 'ci-local-token' }}

  verify:
    name: verify
    if: github.event_name == 'push' || github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a3252b77841bbdd9e4decf73d9a7f1fe76b0493 # v4.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm verify
        env:
          CARINA_REGISTRY_TOKEN: ${{ secrets.CARINA_REGISTRY_TOKEN || 'ci-local-token' }}
