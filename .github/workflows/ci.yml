name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-fast:
    name: verify-fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a3252b77841bbdd9e4decf73d9a7f1fe76b0493 # v4.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:fast
        env:
          CARINA_REGISTRY_TOKEN: ${{ secrets.CARINA_REGISTRY_TOKEN || 'ci-local-token' }}

  verify:
    name: verify
    if: github.event_name == 'push' || github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a3252b77841bbdd9e4decf73d9a7f1fe76b0493 # v4.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm verify
        env:
          CARINA_REGISTRY_TOKEN: ${{ secrets.CARINA_REGISTRY_TOKEN || 'ci-local-token' }}
